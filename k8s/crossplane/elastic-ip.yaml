# Elastic IP for Diet Management App
# Provides static IP that survives spot instance interruptions
---
apiVersion: ec2.aws.upbound.io/v1beta1
kind: EIP
metadata:
  name: diet-app-eip
  labels:
    app: diet-management
spec:
  forProvider:
    region: ap-southeast-2
    domain: vpc
    tags:
      Name: diet-app-eip
      ManagedBy: crossplane
  providerConfigRef:
    name: aws-prod
---
