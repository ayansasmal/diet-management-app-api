# Elastic IP for Diet Management App
# Provides static IP that survives spot instance interruptions
---
apiVersion: ec2.aws.upbound.io/v1beta1
kind: EIP
metadata:
  name: diet-app-eip
  labels:
    app: diet-management
spec:
  # Exclude LateInitialize to prevent Crossplane from picking up instance/networkInterface
  # from observed AWS state. The EIPAssociation resource manages association separately.
  managementPolicies: ["Create", "Update", "Delete", "Observe"]
  forProvider:
    region: ap-southeast-2
    domain: vpc
    tags:
      Name: diet-app-eip
      ManagedBy: crossplane
  providerConfigRef:
    name: aws-prod

# Note: EIP Association is managed separately in eip-association.yaml
# It is applied by deploy-aws.sh after the spot instance is confirmed running
