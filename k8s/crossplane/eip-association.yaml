# EIP Association for Diet Management App
# Associates the Elastic IP with the EC2 spot instance
# This is a TEMPLATE - INSTANCE_ID is substituted at apply time by deploy-aws.sh
# Applied after the spot instance is confirmed running (wait_for_ec2)
---
apiVersion: ec2.aws.upbound.io/v1beta1
kind: EIPAssociation
metadata:
  name: diet-app-eip-assoc
  labels:
    app: diet-management
spec:
  forProvider:
    region: ap-southeast-2
    allocationIdSelector:
      matchLabels:
        app: diet-management
    instanceId: INSTANCE_ID
  providerConfigRef:
    name: aws-prod
