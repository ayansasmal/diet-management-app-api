# AWS Secrets Manager for Diet Management App
# Stores sensitive configuration securely
---
apiVersion: secretsmanager.aws.upbound.io/v1beta1
kind: Secret
metadata:
  name: diet-app-secrets
  labels:
    app: diet-management
spec:
  forProvider:
    region: ap-southeast-2
    name: diet-app/production/secrets
    description: Production secrets for Diet Management App
    # Recovery window (set to 0 for immediate deletion during testing)
    recoveryWindowInDays: 7
    tags:
      Name: diet-app-secrets
      Environment: production
      ManagedBy: crossplane
  providerConfigRef:
    name: aws-prod
---
# Kubernetes Secret to hold the values (applied separately or via sealed-secrets)
# IMPORTANT: Update these values before applying!
---
apiVersion: v1
kind: Secret
metadata:
  name: diet-app-aws-secrets
  namespace: crossplane-system
type: Opaque
stringData:
  # JSON format for AWS Secrets Manager
  # IMPORTANT: Replace all placeholder values before applying
  secret-value: |
    {
      "JWT_SECRET": "CHANGE_THIS_TO_A_SECURE_256_BIT_SECRET",
      "GOOGLE_CLIENT_ID": "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com",
      "GOOGLE_CLIENT_SECRET": "YOUR_GOOGLE_CLIENT_SECRET",
      "DATABASE_URL": "postgresql://dietapp:PASSWORD@diet-app-db.xxxxx.ap-southeast-2.rds.amazonaws.com:5432/diet_management",
      "GITHUB_TOKEN": "ghp_YOUR_GITHUB_PERSONAL_ACCESS_TOKEN"
    }
---
# Secret Version references the Kubernetes secret
apiVersion: secretsmanager.aws.upbound.io/v1beta1
kind: SecretVersion
metadata:
  name: diet-app-secrets-v1
  labels:
    app: diet-management
spec:
  forProvider:
    region: ap-southeast-2
    secretIdSelector:
      matchLabels:
        app: diet-management
    # Reference Kubernetes secret instead of inline value
    secretStringSecretRef:
      name: diet-app-aws-secrets
      namespace: crossplane-system
      key: secret-value
  providerConfigRef:
    name: aws-prod
---
# IAM Policy for EC2 to read secrets
apiVersion: iam.aws.upbound.io/v1beta1
kind: Policy
metadata:
  name: diet-app-secrets-read
  labels:
    app: diet-management
spec:
  forProvider:
    description: Allow EC2 to read Diet App secrets
    policy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": [
              "secretsmanager:GetSecretValue",
              "secretsmanager:DescribeSecret"
            ],
            "Resource": "arn:aws:secretsmanager:ap-southeast-2:*:secret:diet-app/*"
          }
        ]
      }
    tags:
      Name: diet-app-secrets-read
      ManagedBy: crossplane
  providerConfigRef:
    name: aws-prod
---
# Attach secrets policy to EC2 role
apiVersion: iam.aws.upbound.io/v1beta1
kind: RolePolicyAttachment
metadata:
  name: diet-app-secrets-attachment
spec:
  forProvider:
    roleSelector:
      matchLabels:
        app: diet-management
    policyArnSelector:
      matchLabels:
        app: diet-management
  providerConfigRef:
    name: aws-prod
