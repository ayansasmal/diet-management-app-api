# Spot EC2 Instance for Diet Management App
# t4g.micro (ARM) - ~$2.50/month (70-90% cheaper than on-demand)
---
# SSH Key Pair
apiVersion: ec2.aws.upbound.io/v1beta1
kind: KeyPair
metadata:
  name: diet-app-keypair
  labels:
    app: diet-management
spec:
  forProvider:
    region: ap-southeast-2
    # SSH public key for EC2 access
    publicKey: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHfJF/qF+DeQ+5EZK+1L2PjVT4CJP+b2JfBgHd6tGlnA diet-app-aws
    tags:
      Name: diet-app-keypair
      ManagedBy: crossplane
  providerConfigRef:
    name: aws-prod
---
# IAM Role for EC2
apiVersion: iam.aws.upbound.io/v1beta1
kind: Role
metadata:
  name: diet-app-ec2-role
  labels:
    app: diet-management
spec:
  forProvider:
    assumeRolePolicy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Principal": {
              "Service": "ec2.amazonaws.com"
            },
            "Action": "sts:AssumeRole"
          }
        ]
      }
    tags:
      Name: diet-app-ec2-role
      ManagedBy: crossplane
  providerConfigRef:
    name: aws-prod
---
# IAM Instance Profile
apiVersion: iam.aws.upbound.io/v1beta1
kind: InstanceProfile
metadata:
  name: diet-app-ec2-profile
  labels:
    app: diet-management
spec:
  forProvider:
    roleRef:
      name: diet-app-ec2-role
    tags:
      Name: diet-app-ec2-profile
      ManagedBy: crossplane
  providerConfigRef:
    name: aws-prod
---
# IAM Policy for SSM (Session Manager access)
apiVersion: iam.aws.upbound.io/v1beta1
kind: RolePolicyAttachment
metadata:
  name: diet-app-ssm-policy
spec:
  forProvider:
    roleRef:
      name: diet-app-ec2-role
    policyArn: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
  providerConfigRef:
    name: aws-prod
---
# IAM Policy for CloudWatch Logs (Docker awslogs driver)
apiVersion: iam.aws.upbound.io/v1beta1
kind: RolePolicyAttachment
metadata:
  name: diet-app-cloudwatch-policy
spec:
  forProvider:
    roleRef:
      name: diet-app-ec2-role
    policyArn: arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
  providerConfigRef:
    name: aws-prod
---
# IAM Policy for S3 deploy scripts read access
apiVersion: iam.aws.upbound.io/v1beta1
kind: Policy
metadata:
  name: diet-app-s3-deploy-read
  labels:
    app: diet-management
spec:
  forProvider:
    name: diet-app-s3-deploy-read
    policy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": ["s3:GetObject"],
            "Resource": "arn:aws:s3:::diet-app-uploads-851112554948/deploy/*"
          },
          {
            "Effect": "Allow",
            "Action": ["s3:ListBucket"],
            "Resource": "arn:aws:s3:::diet-app-uploads-851112554948",
            "Condition": {
              "StringLike": {
                "s3:prefix": "deploy/*"
              }
            }
          }
        ]
      }
    tags:
      Name: diet-app-s3-deploy-read
      ManagedBy: crossplane
  providerConfigRef:
    name: aws-prod
---
# Attach S3 deploy read policy to EC2 role
apiVersion: iam.aws.upbound.io/v1beta1
kind: RolePolicyAttachment
metadata:
  name: diet-app-s3-deploy-policy
spec:
  forProvider:
    roleRef:
      name: diet-app-ec2-role
    policyArnRef:
      name: diet-app-s3-deploy-read
  providerConfigRef:
    name: aws-prod
---
# Spot Instance Request (creates the actual instance)
apiVersion: ec2.aws.upbound.io/v1beta1
kind: SpotInstanceRequest
metadata:
  name: diet-app-spot
  labels:
    app: diet-management
spec:
  forProvider:
    region: ap-southeast-2
    # Instance configuration
    instanceType: t4g.micro
    ami: ami-0a720a0f93a8f5c92  # Amazon Linux 2023 ARM64 (ap-southeast-2)
    # Maximum price (on-demand price as ceiling)
    spotPrice: "0.0060"
    # Wait for instance to be fulfilled
    waitForFulfillment: true
    # Instance behavior on interruption
    instanceInterruptionBehavior: stop
    # Key pair
    keyName: diet-app-keypair
    # Networking - reference subnet by name
    subnetIdRef:
      name: diet-app-public-a
    # Security groups
    vpcSecurityGroupIdRefs:
      - name: diet-app-ec2-sg
    # IAM instance profile
    iamInstanceProfile: diet-app-ec2-profile
    # Root volume
    rootBlockDevice:
      - volumeSize: 8
        volumeType: gp3
        deleteOnTermination: true
        encrypted: true
    # User data (base64 encoded) - see scripts/ec2-userdata.sh for source
    # Tiny bootstrap: installs Docker+jq, downloads setup from S3
    # Real logic lives in scripts/deploy/ec2-setup.sh and scripts/deploy/start.sh
    userDataBase64: 
    tags:
      Name: diet-app-spot
      ManagedBy: crossplane
  providerConfigRef:
    name: aws-prod
